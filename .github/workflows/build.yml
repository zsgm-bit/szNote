name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  GO_VERSION: "1.23"

jobs:
  # ---------- 1. 代码检查 + 冒烟测试 ----------
  verify:
    name: 校验与冒烟测试
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false

      - name: go vet
        run: go vet ./...

      - name: 编译
        run: CGO_ENABLED=0 go build -trimpath -ldflags="-s -w" -o /tmp/sznote .

      - name: 冒烟测试（写笔记 / 读笔记 / 上传 / 导出 zip / 鉴权）
        run: |
          set -euo pipefail
          mkdir -p /tmp/szn-data
          SZN_PORT=9720 SZN_DATA=/tmp/szn-data SZN_PASSWORD=ci-pass /tmp/sznote &
          for i in $(seq 1 20); do
            curl -sf http://127.0.0.1:9720/api/health >/dev/null && break || sleep 0.5
          done
          echo "--- health"
          curl -sf http://127.0.0.1:9720/api/health
          echo
          echo "--- 未登录应 401"
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:9720/api/ci-note)" = "401"
          echo "--- 登录"
          curl -sf -c /tmp/ck.txt -X POST http://127.0.0.1:9720/api/login \
            -H 'Content-Type: application/json' -d '{"password":"ci-pass"}'
          echo
          echo "--- 保存/读取"
          curl -sf -b /tmp/ck.txt -X PUT http://127.0.0.1:9720/api/ci-note \
            -H 'Content-Type: application/json' -d '{"content":"# ci\n```sh\necho hi\n```","ttl_hours":24}'
          curl -sf -b /tmp/ck.txt http://127.0.0.1:9720/api/ci-note | grep -q '"exists":true'
          echo "--- 上传/导出"
          printf 'hello' > /tmp/a.txt
          curl -sf -b /tmp/ck.txt -F "file=@/tmp/a.txt" http://127.0.0.1:9720/api/ci-note/upload > /dev/null
          curl -sf -b /tmp/ck.txt -o /tmp/e.zip http://127.0.0.1:9720/api/ci-note/export
          unzip -l /tmp/e.zip | grep -q 'files/a.txt'
          echo "--- 文本附件内嵌预览"
          curl -sf -D /tmp/h.txt -o /dev/null -b /tmp/ck.txt http://127.0.0.1:9720/f/ci-note/a.txt
          grep -qi '^content-disposition: inline' /tmp/h.txt
          grep -qi '^content-type: text/plain' /tmp/h.txt
          echo "--- 纯文本模式往返"
          curl -sf -b /tmp/ck.txt -X PUT http://127.0.0.1:9720/api/ci-note \
            -H 'Content-Type: application/json' -d '{"content":"# 不是标题","plain":true}'
          curl -sf -b /tmp/ck.txt http://127.0.0.1:9720/api/ci-note | grep -q '"plain":true'
          echo "--- 非法有效期应 400"
          test "$(curl -s -o /dev/null -w '%{http_code}' -b /tmp/ck.txt -X PUT \
            http://127.0.0.1:9720/api/ci-note -H 'Content-Type: application/json' \
            -d '{"content":"x","ttl_hours":720}')" = "400"
          echo "--- 超过正文上限应 413"
          { printf '{"content":"'; head -c 6000000 /dev/zero | tr '\0' 'a'; printf '"}'; } > /tmp/big.json
          test "$(curl -s -o /dev/null -w '%{http_code}' -b /tmp/ck.txt -X PUT \
            http://127.0.0.1:9720/api/big-note -H 'Content-Type: application/json' \
            --data-binary @/tmp/big.json)" = "413"
          echo "SMOKE OK"

  # ---------- 2. 多平台交叉编译 ----------
  binaries:
    name: 编译 ${{ matrix.goos }}/${{ matrix.goarch }}
    needs: verify
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: linux,   goarch: amd64, ext: "" }
          - { goos: linux,   goarch: arm64, ext: "" }
          - { goos: darwin,  goarch: amd64, ext: "" }
          - { goos: darwin,  goarch: arm64, ext: "" }
          - { goos: windows, goarch: amd64, ext: ".exe" }
          - { goos: windows, goarch: arm64, ext: ".exe" }
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false

      - name: 编译
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          mkdir -p dist
          CGO_ENABLED=0 go build -trimpath -ldflags="-s -w" \
            -o "dist/sznote_${{ matrix.goos }}_${{ matrix.goarch }}${{ matrix.ext }}" .

      - uses: actions/upload-artifact@v4
        with:
          name: bin-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*
          if-no-files-found: error

  # ---------- 3. 多架构 Docker 镜像（推送到 GitHub Container Registry）----------
  docker:
    name: 构建镜像 (amd64/arm64)
    needs: verify
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: 登录 ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 生成镜像标签
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=ref,event=branch
            type=sha,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: 构建并推送
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  # ---------- 4. Tag 自动发版 ----------
  release:
    name: 发布 ${{ github.ref_name }}
    needs: binaries
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: 打包
        run: |
          set -euo pipefail
          # 分发物随附：许可文本（MIT 要求保留版权与许可声明）
          #              + 默认配置 config.json（解压即可改，程序只读这个文件名）
          #              + 配置模板 config.example.json（全字段中文注释）
          #              + README.md（离线可查的使用文档）
          cp LICENSE config.example.json README.md dist/
          cp config.default.json dist/config.json
          cd dist
          FILES="LICENSE config.json config.example.json README.md"
          for f in sznote_*; do
            case "$f" in
              *.tar.gz|*.zip) continue ;;   # 已打包产物，跳过（保证重复执行幂等）
              *.exe) zip -q "${f%.exe}.zip" "$f" $FILES ;;
              *)     tar -czf "$f.tar.gz" "$f" $FILES ;;
            esac
          done
          sha256sum *.tar.gz *.zip > checksums.txt
          ls -lh

      - name: 创建 Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.tar.gz
            dist/*.zip
            dist/checksums.txt
          generate_release_notes: true
          body: |
            szNote ${{ github.ref_name }}

            **压缩包内含**：二进制 + `config.json`（默认配置，直接改这个）+ `config.example.json`（全字段注释模板）+ `README.md` + `LICENSE`

            - 单二进制，无运行时依赖；解压即用
            - 首次运行：`./sznote -hash '你的密码'`，把输出整行填进 `config.json` 的 `server.password_hash`，再 `./sznote`
            - 仅内网免密试跑：把 `config.json` 的 `security.allow_anonymous` 改为 `true`（公网禁止）
            - Docker: `docker run -d -p 9720:9720 -v $PWD/data:/app/data ghcr.io/${{ github.repository }}:${{ github.ref_name }}`
            - 校验: `sha256sum -c checksums.txt`

            授权：MIT License —— 可自由使用、修改、分发、商用，仅需保留版权与许可声明（见 LICENSE）。
