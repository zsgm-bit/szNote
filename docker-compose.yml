services:
  sznote:
    build: .
    image: sznote:local
    container_name: sznote
    restart: unless-stopped
    ports:
      - "9720:9720"                     # 宿主机端口:容器内端口（对外端口改左边这一侧）
    environment:
      - TZ=Asia/Shanghai
      # 所有参数都在 config.json 里配置（端口/密码/上限/有效期/限速…）。
      # 如需临时覆盖单个值，可在这里加环境变量，优先级高于 config.json，例如：
      # - SZN_PASSWORD=change-me
      # - SZN_RATE_KBPS=0
    volumes:
      - ./config.json:/app/config.json:ro   # 配置文件（只读挂载，改完 docker compose restart 生效）
      - ./data:/app/data                    # 笔记与附件持久化
    # ---- 容器加固：只读根文件系统 + 丢弃权限 + 禁止提权 ----
    read_only: true
    tmpfs:
      - /tmp:size=64m                       # multipart 上传的临时文件目录
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
